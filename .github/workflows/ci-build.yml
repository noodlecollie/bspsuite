name: CI Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        BUILD_TARGET: [release]
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025]

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --profile ${{ matrix.BUILD_TARGET }} --verbose
      - name: Run tests
        run: cargo test --profile ${{ matrix.BUILD_TARGET }} --verbose
