[package]
name = "bspsuite-core"
description = "Core algorithms for the BSPSuite compiler"

version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true

[lib]
name = "bspcore"
crate-type = ["rlib", "dylib"]

[dependencies]
bspsuite-extinterface = { path = "../bspsuite-extinterface" }
bspsuite-buildtasks = { path = "../bspsuite-buildtasks" }
anyhow = "1.0.100"
glam = "0.30.9"
libloading = "0.9.0"
log = "0.4.28"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
target-lexicon = "0.13.3"
constcat = "0.6.1"
const-cstr = "0.3.0"
fern = { version = "0.7.1", features = ["colored"] }
paris = { version = "1.5.15", features = ["no_logger"] }

[build-dependencies]
chrono = "0.4.42"
