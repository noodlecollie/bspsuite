[package]
name = "bspsuite-visualiser"
description = "BSPSuite data visualiser"

version.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true

[[bin]]
name = "bspviz"
path = "src/bspviz.rs"

[dependencies]
bspsuite-ffi = { path = "../bspsuite-ffi" }
bspsuite-core = { path = "../bspsuite-core" }
log.workspace = true
anyhow.workspace = true
clap.workspace = true
glam.workspace = true
rand.workspace = true
fern = { version = "0.7.1", features = ["colored"] }
paris = { version = "1.5.15", features = ["no_logger"] }
lazy_static = "1.5.0"
raylib = { version = "6.0.0", features = ["glam", "SUPPORT_IMAGE_GENERATION"] }
