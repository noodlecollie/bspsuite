[bspsuite_dev]
image=docker.io/library/ubuntu:24.04
nvidia=true

# Custom home directory, because this container has messed up my host filesystem more times than I'm happy with.
home=$HOME/distrobox_containers/bspsuite_dev

# Volume mappings from host to container
volume=".:/workspace"

# General deps
additional_packages="git cmake build-essential ninja-build vim gdb iproute2 net-tools procps"

# SSH deps
additional_packages="ssh openssl ca-certificates"

# Deps for raylib
# Beware: if the wrong Clang package is installed, bindgen can
# fail to find stdarg.h (or other system headers).
additional_packages="mesa-utils mesa-common-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libclang1-20 librust-clang-sys-dev"

# Rust
additional_packages="rustup"

# For Zed (not sure why it needs this?)
additional_packages="libasound2t64"

# Other steps that are too annoying to do directly from here, because these strings are fed to eval
# and it's really easy to break things.
init_hooks="/workspace/.distrobox/root_setup.sh $USER 2222"
init_hooks="sudo -u ${USER} /workspace/.distrobox/user_setup.sh"
